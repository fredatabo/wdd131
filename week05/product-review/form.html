<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form - Share Your Experience</title>
    <meta name="description" content="An application to submit and manage product reviews. Rate products, share installation dates, and provide feedback on useful features.">
    <meta name="author" content="Frederick Atabo">
    <link rel="stylesheet" href="styles/form.css">
    <script src="js/form.js" defer></script>
</head>
<body>
<div class="form-container">
    <!-- Semantic header element -->
    <header class="main-header">
        <h1>⭐ Share your review</h1>
        <p>Tell us about your experience — your feedback helps others choose better</p>
    </header>

    <!-- 
        Form uses method="get" for GitHub Pages compatibility
        Action points to review.html confirmation page
    -->
    <form id="productReviewForm" method="get" action="review.html">
        <!-- Product Name - Select element with static fallback options -->
        <div class="field-group">
            <label for="productSelect">Product name <span class="required-star">*</span></label>
            <div class="field-widget">
                <select id="productSelect" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                    <option value="EcoSmart Bluetooth Speaker">EcoSmart Bluetooth Speaker</option>
                    <option value="FlexStand Ergonomic Laptop Stand">FlexStand Ergonomic Laptop Stand</option>
                    <option value="AquaPure Water Filter Pitcher">AquaPure Water Filter Pitcher</option>
                    <option value="Lumina LED Desk Lamp (Wireless Charging)">Lumina LED Desk Lamp (Wireless Charging)</option>
                    <option value="SmartFit Fitness Tracker 2.0">SmartFit Fitness Tracker 2.0</option>
                </select>
                <span class="req-hint">required</span>
            </div>
        </div>

        <!-- Overall Rating - Radio buttons (stars) - static HTML with 5 radios -->
        <div class="field-group">
            <label>Overall rating <span class="required-star">*</span></label>
            <div class="field-widget">
                <div class="rating-stars" id="ratingStarsContainer">
                    <div class="star-option">
                        <input type="radio" name="overallRating" value="1" id="rating_1" required>
                        <label for="rating_1"><span class="star-emoji">★☆☆☆☆</span> <span>1</span></label>
                    </div>
                    <div class="star-option">
                        <input type="radio" name="overallRating" value="2" id="rating_2" required>
                        <label for="rating_2"><span class="star-emoji">★★☆☆☆</span> <span>2</span></label>
                    </div>
                    <div class="star-option">
                        <input type="radio" name="overallRating" value="3" id="rating_3" required>
                        <label for="rating_3"><span class="star-emoji">★★★☆☆</span> <span>3</span></label>
                    </div>
                    <div class="star-option">
                        <input type="radio" name="overallRating" value="4" id="rating_4" required>
                        <label for="rating_4"><span class="star-emoji">★★★★☆</span> <span>4</span></label>
                    </div>
                    <div class="star-option">
                        <input type="radio" name="overallRating" value="5" id="rating_5" required>
                        <label for="rating_5"><span class="star-emoji">★★★★★</span> <span>5</span></label>
                    </div>
                </div>
                <span class="req-hint">required (choose one)</span>
            </div>
        </div>

        <!-- Date of Installation -->
        <div class="field-group">
            <label for="installDate">Installation date <span class="required-star">*</span></label>
            <div class="field-widget">
                <input type="date" id="installDate" name="installDate" required>
            </div>
        </div>

        <!-- Useful Features - Checkboxes (check all that apply) - static HTML with 5 checkboxes -->
        <div class="field-group">
            <label>Useful features</label>
            <div class="field-widget">
                <div class="checkbox-group" id="featuresGroup">
                    <div class="checkbox-item">
                        <input type="checkbox" id="feature_easy" name="feature_easy" value="Easy installation">
                        <label for="feature_easy">Easy to install</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="feature_performance" name="feature_performance" value="Great performance">
                        <label for="feature_performance">Great performance</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="feature_battery" name="feature_battery" value="Long battery life">
                        <label for="feature_battery">Long battery life</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="feature_design" name="feature_design" value="Sleek design">
                        <label for="feature_design">Sleek design</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="feature_value" name="feature_value" value="Good value">
                        <label for="feature_value">Good value for money</label>
                    </div>
                </div>
                <span class="hint-text">select all that apply</span>
            </div>
        </div>

        <!-- Written Review - Textarea (optional) -->
        <div class="field-group">
            <label for="writtenReview">Written review</label>
            <div class="field-widget">
                <textarea id="writtenReview" name="writtenReview" 
                          placeholder="Share your honest opinion... (optional)"></textarea>
            </div>
        </div>

        <!-- User Name - Text input (optional) -->
        <div class="field-group">
            <label for="userName">Your name</label>
            <div class="field-widget">
                <input type="text" id="userName" name="userName" 
                       placeholder="e.g., Alex Johnson (optional)">
            </div>
        </div>

        <!-- Form Submission Button -->
        <div class="submit-area">
            <input type="submit" class="submit-btn" value="Submit review →">
        </div>
    </form>

    <!-- Semantic footer element -->
    <footer class="main-footer">
        <p>© 2025 Product Review Hub — Assignment Project</p>
        <p>Honest feedback drives better products | All fields marked with * are required</p>
    </footer>
</div>


</body>
</html>
