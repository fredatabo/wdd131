<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Product Review Form | Share Your Experience</title>
       
    <meta name="description" content="An application to submit and manage product reviews. Rate products, share installation dates, and provide feedback on useful features.">
    <meta name="author" content="Frederick Atabo">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="styles/form.css">
</head>
<body>
<div class="form-container">
    <div class="form-header">
        <h1>⭐ Share your review</h1>
        <p>Tell us about your experience — your feedback helps others choose better</p>
    </div>

    <!-- 
        Form uses method="get" for GitHub Pages compatibility
        Action points to review.html confirmation page
    -->
    <form id="productReviewForm" method="get" action="review.html">
        <!-- Product Name - Select element -->
        <div class="field-group">
            <label for="productSelect">Product name <span class="required-star">*</span></label>
            <div class="field-widget">
                <select id="productSelect" name="productName" required>
                    <!-- Options populated dynamically by JavaScript -->
                </select>
                <span class="req-hint">required</span>
            </div>
        </div>

        <!-- Overall Rating - Radio buttons (stars) -->
        <div class="field-group">
            <label>Overall rating <span class="required-star">*</span></label>
            <div class="field-widget">
                <div class="rating-stars" id="ratingStarsContainer">
                    <!-- Stars generated by JavaScript -->
                </div>
                <span class="req-hint">required (choose one)</span>
            </div>
        </div>

        <!-- Date of Installation -->
        <div class="field-group">
            <label for="installDate">Installation date <span class="required-star">*</span></label>
            <div class="field-widget">
                <input type="date" id="installDate" name="installDate" required>
            </div>
        </div>

        <!-- Useful Features - Checkboxes (check all that apply) -->
        <div class="field-group">
            <label>Useful features</label>
            <div class="field-widget">
                <div class="checkbox-group" id="featuresGroup">
                    <!-- Checkboxes generated by JavaScript -->
                </div>
                <span class="req-hint" style="color:#5f6c7a;">select all that apply</span>
            </div>
        </div>

        <!-- Written Review - Textarea (optional) -->
        <div class="field-group">
            <label for="writtenReview">Written review</label>
            <div class="field-widget">
                <textarea id="writtenReview" name="writtenReview" 
                          placeholder="Share your honest opinion... (optional)"></textarea>
            </div>
        </div>

        <!-- User Name - Text input (optional) -->
        <div class="field-group">
            <label for="userName">Your name</label>
            <div class="field-widget">
                <input type="text" id="userName" name="userName" 
                       placeholder="e.g., Alex Johnson (optional)">
            </div>
        </div>

        <!-- Form Submission Button -->
        <div class="submit-area">
            <input type="submit" class="submit-btn" value="Submit review →">
        </div>
    </form>

    <!-- Common footer content as required on all assignments -->
    <div class="assignment-footer">
        <p>© 2026 Product Review Hub — Assignment Project</p>
        <p>Honest feedback drives better products | All fields marked with * are required</p>
    </div>
</div>

<script src="js/form.js"></script>
</body>
</html>
