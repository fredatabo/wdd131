<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filtered Temples - LDS Temple Gallery</title>
  <meta name="description" content="A responsive gallery showcasing Latter-day Saint temples from around the world.">
  <meta name="author" content="Frederick Atabo">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- CSS Files - Mobile First -->
  <link rel="stylesheet" href="styles/filtered-temples.css">
  <link rel="stylesheet" href="styles/filtered-temples-large.css">
  
  <!-- JavaScript -->
  <script src="scripts/filtered-temples.js" defer></script>
</head>
<body>
  <header>
    <div class="header-container">
      <div class="logo">
        <i class="fas fa-church"></i>
        <span class="logo-title">Filtered Temples</span>
      </div>
      <button class="hamburger" id="hamburger" aria-label="Menu">
        <i class="fas fa-bars"></i>
      </button>
    </div>
    <nav id="nav-menu">
      <ul class="nav-menu">
        <li><a href="#" class="active"><i class="fas fa-home"></i> <span>Home</span></a></li>
        <li><a href="#"><i class="fas fa-clock"></i> <span>Old</span></a></li>
        <li><a href="#"><i class="fas fa-star"></i> <span>New</span></a></li>
        <li><a href="#"><i class="fas fa-expand"></i> <span>Large</span></a></li>
        <li><a href="#"><i class="fas fa-compress"></i> <span>Small</span></a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Frederick Atabo</h1>
    <div class="hero">
      <h2>Temple Gallery</h2>
      <p>Exploring sacred spaces around the world</p>
    </div>
    
    <!-- Dynamic gallery - all temple figures will be generated by JavaScript -->
    <div class="gallery" id="dynamic-gallery"></div>
  </main>

  <footer>
    <div class="footer-content">
      <div class="footer-section">
        <h3><i class="fas fa-church"></i> Filtered Temples</h3>
        <p>Celebrating sacred architecture</p>
      </div>
      <div class="footer-section">
        <p>&copy; <span id="currentyear"></span> Frederick Atabo | Abuja, Nigeria</p>
        <p id="lastModified"></p>
      </div>
      <div class="footer-section social">
        <a href="#" aria-label="Facebook"><i class="fab fa-facebook"></i></a>
        <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
        <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
      </div>
    </div>
  </footer>

  <!-- Overlay for mobile menu -->
  <div class="overlay" id="overlay"></div>
</body>
</html>
